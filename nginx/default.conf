server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Expo static export: real .html files + client-side routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_expo/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
